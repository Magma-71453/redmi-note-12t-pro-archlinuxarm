# 唯一版本/目标配置。构建脚本 source 本文件。
VERSION_TITLE="Test"
BUILD_DATE_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

TARGET_DEVICE="pearl"
TARGET_ARCH="arm64"
TARGET_SOC="mt6895"
TARGET_MODEL="23054RA19C"

KERNEL_SERIES="7.2"
KERNEL_VERSION="7.2.10"
KERNEL_LOCALVERSION="-pearl-server-test"
KERNEL_TARBALL="linux-${KERNEL_VERSION}.tar.xz"
KERNEL_URL="https://cdn.kernel.org/pub/linux/kernel/v7.x/${KERNEL_TARBALL}"

ALARM_ARCH="aarch64"
ALARM_TARBALL="ArchLinuxARM-aarch64-latest.tar.gz"
ALARM_URL="https://archlinuxarm.org/os/${ALARM_TARBALL}"

DISK="/dev/sdc"
PART_BOOT_A="/dev/sdc43"
PART_BOOT_B="/dev/sdc72"
PART_USERDATA="/dev/sdc86"
PART_LINUX="/dev/sdc88"
LINUX_FS_LABEL="archpearl"
LINUX_FS_UUID_ORIGIN="b7ae3de3-b7d9-4df6-a640-6d66cfa988da"

ROOTFS_IMAGE_SIZE="12G"
ROOTFS_IMAGE_NAME="pearl-linux-rootfs-${VERSION_TITLE}.img"
KERNEL_CMDLINE="console=tty0 console=ttyS0,115200 earlycon root=PARTLABEL=linux rootfstype=ext4 rw rootwait init=/sbin/init"

ROOTFS_PACKAGES=(
  base base-devel linux-firmware
  systemd systemd-resolvconf systemd-networkd systemd-timesyncd
  openssh networkmanager dhcpcd iwd wireless-regdb
  docker docker-compose podman buildah skopeo
  labwc kitty neovim foot wl-clipboard
  mesa mesa-utils vulkan-icd-loader
  sudo git curl wget htop tmux jq rsync unzip
  python python-pip nodejs npm go rust
  zram-generator earlyoom
)
