# 唯一版本/目标配置。构建脚本 source 本文件。
VERSION_TITLE="Test"
BUILD_DATE_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

TARGET_DEVICE="pearl"
TARGET_ARCH="arm64"
TARGET_SOC="mt6895"
TARGET_MODEL="23054RA19C"

KERNEL_SERIES="7.2"
KERNEL_VERSION="7.2.9"
KERNEL_LOCALVERSION="+"
KERNEL_RELEASE_SUFFIX="+"

ALARM_ARCH="aarch64"
